<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>admin.html</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#EFF3F8;--card:#FFFFFF;--surface:#F8FAFC;--ink:#0F172A;--ink2:#334155;--muted:#64748B;--line:#E2E8F0;
  --accent:#2563EB;--accent-hover:#1D4ED8;--accent-soft:#EFF6FF;--accent-line:#BFDBFE;
  --ok:#10B981;--ok-text:#047857;--ok-soft:#ECFDF5;--ok-line:#A7F3D0;
  --warn:#D97706;--warn-soft:#FFFBEB;--warn-line:#FDE68A;
  --bad:#DC2626;--bad-soft:#FEF2F2;--bad-line:#FECACA;
  --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink);
  font:14.5px/1.5 "DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,.kpi b,.name{font-family:"Sora","DM Sans",system-ui,sans-serif}
a{color:var(--accent)}
.hidden{display:none!important}
.sub{color:var(--muted);margin:2px 0 0;font-size:13px}

/* App Shell: Left Icon Sidebar + Main Content */
.shell{display:grid;grid-template-columns:64px 1fr;min-height:100vh}
.rail{
  background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:10px;
  position:sticky;top:0;height:100vh;z-index:20;
}
.rail-logo{
  width:40px;height:40px;border-radius:11px;background:var(--ink);color:#fff;
  display:grid;place-items:center;margin-bottom:10px;
}
.rail-logo svg,.rail-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rail-btn{
  width:42px;height:42px;border-radius:11px;border:0;background:transparent;color:var(--muted);
  display:grid;place-items:center;cursor:pointer;transition:all .18s;
}
.rail-btn:hover{background:var(--surface);color:var(--ink)}
.rail-btn.active{background:var(--accent-soft);color:var(--accent)}
.rail-spacer{flex:1}

.main{display:flex;flex-direction:column;min-width:0}

/* Top White Header with Inline KPIs */
.topbar{
  background:#fff;border-bottom:1px solid var(--line);
  padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;
}
.top-title h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.025em;color:var(--ink)}
.top-kpis{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.kpi small{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:500}
.kpi small i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.kpi b{display:block;font-size:20px;font-weight:800;color:var(--ink);line-height:1.25;margin-top:2px;letter-spacing:-.02em}

/* Main Workspace */
.content{padding:24px 28px 70px;max-width:1180px;width:100%}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.search-box{position:relative;flex:1 1 280px;max-width:360px}
.search-box svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
.search{
  width:100%;padding:10px 14px 10px 38px;font:inherit;font-size:14px;
  border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);
}
.search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fpill{
  padding:8px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;
  color:var(--ink2);font:600 13px "DM Sans",sans-serif;cursor:pointer;transition:all .15s;
}
.fpill:hover{border-color:#CBD5E1}
.fpill.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Horizontal Shop Cards matching Mockup */
.shop-card{
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin-bottom:12px;
  box-shadow:0 1px 3px rgba(15,23,42,.04);
  display:grid;grid-template-columns:1.25fr 1fr auto;gap:20px;align-items:center;
  transition:border-color .18s;
}
.shop-card:hover{border-color:#CBD5E1}
.name{font-size:16.5px;font-weight:700;color:var(--ink);letter-spacing:-.02em}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.badge{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.badge.paid{background:var(--ok);color:#fff}
.badge.trial{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line)}
.badge.bad{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad-line)}
.badge.plan{background:var(--surface);color:var(--ink2);border:1px solid var(--line)}
.meta{font-size:12.5px;color:var(--muted);margin-top:6px;word-break:break-all}

.usage-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink2);font-weight:500}
.usage-top span:last-child{font-weight:700;color:var(--ink)}
.usage-bar{width:100%;height:7px;background:#E2E8F0;border-radius:999px;overflow:hidden;margin-top:8px}
.usage-fill{height:100%;background:var(--accent);border-radius:999px}

.acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.btn{
  border:0;border-radius:9px;cursor:pointer;padding:8px 14px;
  background:var(--accent);color:#fff;font:600 13px/1.15 "DM Sans",sans-serif;
  transition:all .15s;white-space:nowrap;
}
.btn:hover:not(:disabled){background:var(--accent-hover)}
.btn.soft{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line)}
.btn.soft:hover{background:#DBEAFE}
.btn.line{background:#fff;color:var(--ink2);border:1px solid #CBD5E1}
.btn.line:hover{border-color:var(--accent);color:var(--accent)}
.btn.grey{background:#E2E8F0;color:var(--ink2)}
.btn.grey:hover{background:#CBD5E1}
.btn.danger{background:#fff;color:var(--bad);border:1px solid var(--bad-line)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.full{width:100%;padding:12px;font-size:14.5px;margin-top:16px}

/* Settings View & Auth */
.panel-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px;max-width:560px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
.panel-card h2{font-size:17px;margin:0 0 6px}
.f{display:block;margin-top:14px;font-size:13px;font-weight:600;color:var(--ink2)}
.f input{display:block;width:100%;margin-top:6px;padding:10px 13px;font:inherit;font-size:14.5px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.f input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.msg{font-size:13.5px;min-height:1.2em;margin:10px 0 0;color:var(--bad);font-weight:500}.msg.ok{color:var(--ok-text)}
.auth-wrap{max-width:390px;margin:0 auto;padding:12vh 18px}

/* Modal Sheet & Toast */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(15,23,42,.45);backdrop-filter:blur(5px);padding:16px}
.sheet-in{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 20px 50px rgba(15,23,42,.18)}
.sheet-in h2{margin:0;font-size:18px}
.pick{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:10px;padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.pick:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.pick b{display:block;font:700 14.5px "Sora",sans-serif}
.pick small{color:var(--muted);font-size:12.5px}
.pick:disabled{border-color:var(--accent-line);background:var(--accent-soft);cursor:default}
.pick .tag{font-size:11.5px;padding:3px 9px;border-radius:99px;background:var(--accent);color:#fff;font-weight:600}
.toast{position:fixed;left:0;right:0;margin:0 auto;width:max-content;max-width:90vw;bottom:24px;z-index:60;padding:10px 18px;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;font-size:13.5px;box-shadow:0 10px 30px rgba(15,23,42,.25)}

@media(max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;left:0;right:0;bottom:0;top:auto;height:58px;flex-direction:row;justify-content:space-around;padding:0 12px;border-right:0;border-top:1px solid var(--line)}
  .rail-logo,.rail-spacer{display:none}
  .topbar{padding:14px 16px}
  .content{padding:16px 14px 82px}
  .shop-card{grid-template-columns:1fr;gap:14px}
  .acts{justify-content:flex-start}
}
</style>
</head>
<body>
<main class="auth-wrap hidden" id="authView">
  <div style="text-align:center;margin-bottom:20px">
    <div class="rail-logo" style="margin:0 auto 10px"><svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg></div>
    <h1 style="margin:0;font-size:22px">XeroxFlow Admin</h1>
    <p class="sub">Super Admin Login</p>
  </div>
  <form class="panel-card" id="loginForm" novalidate style="margin:0">
    <label class="f" style="margin-top:0">Email<input type="email" id="email" autocomplete="username" required></label>
    <label class="f">Password<input type="password" id="pass" autocomplete="current-password" required></label>
    <p class="msg" id="lmsg" role="alert"></p>
    <button class="btn full" type="submit">Login</button>
  </form>
</main>

<div class="shell hidden" id="appView">
  <aside class="rail" aria-label="Navigation">
    <div class="rail-logo" title="XeroxFlow">
      <svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
    </div>
    <button class="rail-btn active" id="navShops" title="Shops" type="button">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </button>
    <button class="rail-btn" id="navSearch" title="Search" type="button">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
    <button class="rail-btn" id="navSettings" title="Plans &amp; Payment Settings" type="button">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <div class="rail-spacer"></div>
    <button class="rail-btn" id="logout" title="Logout" type="button">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="top-title">
        <h1>XeroxFlow Admin</h1>
        <p class="sub">Super Admin Panel</p>
      </div>
      <div class="top-kpis">
        <div class="kpi"><small><i></i>Total Shops</small><b id="sTotal">0</b></div>
        <div class="kpi"><small>Orders Today</small><b id="sOrders">0</b></div>
        <div class="kpi"><small>Paid Shops</small><b id="sPaid">0</b></div>
        <div class="kpi"><small>Active Trials</small><b id="sTrial">0</b></div>
      </div>
    </header>

    <main class="content">
      <div id="shopsPane">
        <div class="toolbar">
          <div class="search-box">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input class="search" id="search" type="search" placeholder="Search shop, email or slug..." aria-label="Search">
          </div>
          <div class="filters" id="filterBar">
            <button class="fpill on" data-k="all" type="button">All</button>
            <button class="fpill" data-k="paid" type="button">Paid</button>
            <button class="fpill" data-k="trial" type="button">Trial</button>
            <button class="fpill" data-k="bad" type="button">Expired / Pause</button>
          </div>
        </div>
        <div id="list"></div>
        <p class="msg" id="gmsg" role="alert"></p>
      </div>

      <div id="settingsPane" class="hidden">
        <div class="panel-card">
          <h2>Payment Settings</h2>
          <p class="sub">Owners ko subscription page par ye UPI aur WhatsApp dikhega.</p>
          <form id="setForm" novalidate>
            <label class="f">Aapka UPI ID<input type="text" id="setUpi" placeholder="naam@upi" autocapitalize="none"></label>
            <label class="f">WhatsApp number (91 ke saath, jaise 919876543210)<input type="tel" id="setWa" inputmode="numeric"></label>
            <button class="btn full" type="submit">Save Settings</button>
            <p class="msg" id="smsg"></p>
          </form>
        </div>

        <div class="panel-card">
          <h2>Plans &amp; Monthly Limits</h2>
          <form id="planForm" novalidate>
            <div id="planRows"></div>
            <button class="btn full" type="submit">Save Plans</button>
            <p class="msg" id="pmsg"></p>
          </form>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="sheet hidden" id="pickView" role="dialog" aria-modal="true" aria-labelledby="pickT">
  <div class="sheet-in">
    <h2 id="pickT"></h2><p class="sub" id="pickS"></p>
    <div id="pickList"></div>
    <button class="btn line full" id="pickX" type="button">Band karo</button>
  </div>
</div>
<div class="toast hidden" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://iwzacblitkdzenmrugjj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_e5XcNyI8JFpzgMwBmE5XIg__BGgyjKM';
const $ = id => document.getElementById(id);
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: 'xf-admin-auth' } });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DAY = 86400000;
let shops = [], plans = {}, cfg = { monthly_price: '499', upi_id: '', whatsapp: '' }, statusFilter = 'all';

function show(v) { $('authView').classList.toggle('hidden', v !== 'auth'); $('appView').classList.toggle('hidden', v !== 'app'); }
function setPane(pane) {
  $('shopsPane').classList.toggle('hidden', pane !== 'shops');
  $('settingsPane').classList.toggle('hidden', pane !== 'settings');
  $('navShops').classList.toggle('active', pane === 'shops');
  $('navSettings').classList.toggle('active', pane === 'settings');
}
$('navShops').addEventListener('click', () => setPane('shops'));
$('navSettings').addEventListener('click', () => setPane('settings'));
$('navSearch').addEventListener('click', () => { setPane('shops'); $('search').focus(); });
$('filterBar').addEventListener('click', e => {
  const b = e.target.closest('.fpill'); if (!b) return;
  statusFilter = b.dataset.k;
  $('filterBar').querySelectorAll('.fpill').forEach(x => x.classList.toggle('on', x === b));
  render();
});

const left = iso => iso ? Math.ceil((new Date(iso) - Date.now()) / DAY) : 0;
const fmt = iso => new Date(iso).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });

function info(s) {
  if (s.status === 'paused') return { t: 'Paused', c: 'bad', k: 'bad' };
  const p = left(s.paid_until), t = left(s.trial_ends_at);
  if (p > 0) return { t: `Paid · ${p}d`, c: 'paid', k: 'paid' };
  if (t > 0) return { t: `Trial · ${t}d`, c: 'trial', k: 'trial' };
  return { t: 'Expired', c: 'bad', k: 'bad' };
}

function render() {
  const q = $('search').value.trim().toLowerCase();
  const kinds = shops.map(s => info(s).k);
  $('sTotal').textContent = shops.length;
  $('sOrders').textContent = shops.reduce((sum, s) => sum + (Number(s.orders_today) || 0), 0);
  $('sPaid').textContent = kinds.filter(k => k === 'paid').length;
  $('sTrial').textContent = kinds.filter(k => k === 'trial').length;

  const items = shops.filter(s => {
    if (statusFilter !== 'all' && info(s).k !== statusFilter) return false;
    if (q && !(s.name + ' ' + s.email + ' ' + s.slug).toLowerCase().includes(q)) return false;
    return true;
  });

  $('list').innerHTML = items.length ? items.map((s, idx) => {
    const i = info(s);
    const lim = (plans[s.plan] || {}).monthly_limit || 300;
    const used = Number(s.orders_month) || 0;
    const pct = Math.min(100, Math.round(used / lim * 100));
    return `<div class="shop-card">
      <div>
        <div class="name">${esc(s.name)}</div>
        <div class="pills">
          <span class="badge ${i.c}">${esc(i.t)}</span>
          <span class="badge plan">${esc((plans[s.plan] || {}).name || s.plan)}</span>
        </div>
        <div class="meta">${esc(s.email)} · /s/${esc(s.slug)} · Aaj ${s.orders_today} orders</div>
      </div>
      <div>
        <div class="usage-top"><span>Monthly order usage</span><span>${used} / ${lim} orders</span></div>
        <div class="usage-bar"><div class="usage-fill" style="width:${pct}%;background:${pct >= 90 ? 'var(--bad)' : 'var(--accent)'}"></div></div>
        <div class="meta">Total ${s.orders_total} orders · Joined ${fmt(s.created_at)}</div>
      </div>
      <div class="acts">
        <button class="btn ${idx === 0 ? '' : 'soft'}" data-act="add1" data-id="${s.id}">+1 Month</button>
        <button class="btn line" data-act="plan" data-id="${s.id}">Plan</button>
        ${s.status === 'paused'
          ? `<button class="btn soft" data-act="resume" data-id="${s.id}">Resume</button>`
          : `<button class="btn grey" data-act="pause" data-id="${s.id}">Pause</button>`}
        ${left(s.paid_until) > 0 ? '' : `<button class="btn line" data-act="trial7" data-id="${s.id}">+7d</button>`}
        ${(left(s.paid_until) > 0 || left(s.trial_ends_at) > 0) ? `<button class="btn danger" data-act="cancel" data-id="${s.id}">Cancel</button>` : ''}
      </div>
    </div>`;
  }).join('') : '<div class="panel-card sub" style="max-width:none;text-align:center;padding:36px">Koi dukaan nahi mili.</div>';
}

async function load() {
  $('gmsg').textContent = '';
  const [a, b, c] = await Promise.all([sb.rpc('admin_list_shops'), sb.from('app_settings').select('*'), sb.from('plans').select('*').order('monthly_limit')]);
  if (a.error) {
    const m = a.error.message || '';
    if (/not allowed/i.test(m)) { show('auth'); $('lmsg').textContent = 'Ye account admin nahi hai.'; await sb.auth.signOut(); }
    else {
      $('gmsg').textContent = 'Error: ' + m;
      if ($('appView').classList.contains('hidden')) { show('auth'); $('lmsg').textContent = 'Error: ' + m; }
    }
    return;
  }
  shops = a.data || [];
  (b.data || []).forEach(r => cfg[r.key] = r.value);
  plans = {}; (c.data || []).forEach(p => plans[p.key] = p);
  renderPlanForm();
  $('setUpi').value = cfg.upi_id; $('setWa').value = cfg.whatsapp;
  render(); show('app');
}

async function call(fn, args) {
  const { data: sess } = await sb.auth.getSession();
  if (!sess.session) { alert('Login session khatam ho gaya. Dobara login karein.'); show('auth'); return; }
  const { error } = await sb.rpc(fn, args);
  if (error) {
    const m = error.message || String(error);
    $('gmsg').textContent = 'Error: ' + m;
    alert('Error: ' + m);
    return false;
  }
  await load();
  return true;
}

let toastT = null;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), 3200);
}
function openPicker(s) {
  $('pickT').textContent = s.name;
  $('pickS').textContent = 'Kaun sa plan dena hai? Tap karein.';
  $('pickList').innerHTML = Object.values(plans).map(p => `
    <button class="pick" type="button" data-key="${esc(p.key)}"${p.key === s.plan ? ' disabled' : ''}>
      <span><b>${esc(p.name)}</b><small>${p.monthly_limit} orders / mahina · ₹${esc(p.price)}</small></span>
      ${p.key === s.plan ? '<span class="tag">Current</span>' : ''}
    </button>`).join('');
  $('pickView').dataset.id = s.id;
  $('pickView').classList.remove('hidden');
}
function closePicker() { $('pickView').classList.add('hidden'); }
$('pickX').addEventListener('click', closePicker);
$('pickView').addEventListener('click', async e => {
  if (e.target === e.currentTarget) return closePicker();
  const b = e.target.closest('.pick'); if (!b || b.disabled) return;
  const s = shops.find(x => x.id === $('pickView').dataset.id); if (!s) return;
  closePicker();
  if (await call('admin_set_shop_plan', { p_shop_id: s.id, p_plan: b.dataset.key })) toast(`${s.name}: ${plans[b.dataset.key].name} plan laga diya`);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePicker(); });

async function giveTrial(s) {
  if (s.status === 'paused' && !(await call('admin_set_status', { p_shop_id: s.id, p_status: 'trial' }))) return;
  const target = Date.now() + 7 * DAY - 3600000;
  if (!(await call('admin_extend_trial', { p_shop_id: s.id, p_days: 7 }))) return;
  const now = shops.find(x => x.id === s.id);
  if (now) {
    const short = Math.ceil((target - new Date(now.trial_ends_at)) / DAY);
    if (short > 0 && !(await call('admin_extend_trial', { p_shop_id: s.id, p_days: short }))) return;
  }
  toast(`${s.name}: 7 din ka trial chalu`);
}

async function cancelPlan(s) {
  if (!confirm(`${s.name} ka plan abhi cancel karein?\nDukaan turant Expired ho jayegi.`)) return;
  if (await call('admin_cancel_plan', { p_shop_id: s.id })) toast(`${s.name}: plan cancel ho gaya`);
}

$('list').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const s = shops.find(x => x.id === b.dataset.id); if (!s) return;
  const price = Number((plans[s.plan] || {}).price) || 0;
  if (b.dataset.act === 'add1') {
    if (confirm(`${s.name}: ₹${price} mil gaye? 1 mahina chalu karein?`))
      call('admin_activate', { p_shop_id: s.id, p_months: 1, p_amount: price, p_note: 'manual UPI' });
  } else if (b.dataset.act === 'plan') {
    openPicker(s);
  } else if (b.dataset.act === 'trial7') {
    giveTrial(s);
  } else if (b.dataset.act === 'cancel') {
    cancelPlan(s);
  } else if (b.dataset.act === 'pause') {
    if (confirm(`${s.name} ko pause karein? Customers order nahi de payenge.`)) call('admin_set_status', { p_shop_id: s.id, p_status: 'paused' });
  } else if (b.dataset.act === 'resume') {
    call('admin_set_status', { p_shop_id: s.id, p_status: left(s.paid_until) > 0 ? 'active' : 'trial' });
  }
});

$('setForm').addEventListener('submit', async e => {
  e.preventDefault();
  const vals = { upi_id: $('setUpi').value.trim(), whatsapp: $('setWa').value.replace(/\D/g, '') };
  for (const [k, v] of Object.entries(vals)) {
    const { error } = await sb.rpc('admin_set_setting', { p_key: k, p_value: v });
    if (error) { $('smsg').classList.remove('ok'); $('smsg').textContent = 'Error: ' + error.message; alert('Error: ' + error.message); return; }
  }
  Object.assign(cfg, vals);
  $('smsg').classList.add('ok'); $('smsg').textContent = 'Settings save ho gayi.';
});

function renderPlanForm() {
  $('planRows').innerHTML = Object.values(plans).map(p => `
    <label class="f"><strong>${esc(p.name)}</strong> · order limit / mahina<input type="number" min="1" data-pl="${esc(p.key)}" data-f="limit" value="${p.monthly_limit}"></label>
    <label class="f">${esc(p.name)} · price (₹ / mahina)<input type="number" min="0" data-pl="${esc(p.key)}" data-f="price" value="${p.price}"></label>`).join('');
}
$('planForm').addEventListener('submit', async e => {
  e.preventDefault();
  for (const p of Object.values(plans)) {
    const lim = Number(document.querySelector(`[data-pl="${p.key}"][data-f="limit"]`).value);
    const pr = Number(document.querySelector(`[data-pl="${p.key}"][data-f="price"]`).value);
    const { error } = await sb.rpc('admin_set_plan', { p_key: p.key, p_limit: lim, p_price: pr });
    if (error) { $('pmsg').classList.remove('ok'); $('pmsg').textContent = 'Error: ' + error.message; alert('Error: ' + error.message); return; }
  }
  await load();
  $('pmsg').classList.add('ok'); $('pmsg').textContent = 'Plans save ho gaye.';
});
$('search').addEventListener('input', render);
$('logout').addEventListener('click', async () => { await sb.auth.signOut(); show('auth'); });
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault(); $('lmsg').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim().toLowerCase(), password: $('pass').value });
  if (error) return $('lmsg').textContent = /invalid/i.test(error.message) ? 'Email ya password galat hai.' : error.message;
  load();
});

(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) load(); else show('auth');
})();
</script>
</body>
</html>
