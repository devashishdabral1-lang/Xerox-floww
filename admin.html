<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xerox Flow – Admin</title>
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">

<style>
:root{--paper:#0a0a0a;--card:#141414;--card2:#1b1b1b;--ink:#ececec;--muted:#8b8b8b;--line:#272727;--accent:#9de24f;--ok:#2dd4a7;--warn:#f5b942;--bad:#ff6b5e;--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background-color:var(--paper);background-image:radial-gradient(900px 420px at 50% -140px,rgba(157,226,79,.11),transparent 70%),radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:auto,24px 24px;background-attachment:fixed;color:var(--ink);font:15.5px/1.55 "DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
h1,h2,.shop,.ticket,.stat b,.amount,.tno,.name,.center h2{font-family:"Sora","DM Sans",system-ui,sans-serif}
a{color:var(--accent)}
.hidden{display:none!important}
.sub{color:var(--muted);margin:5px 0 0;font-size:14px}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(45,212,167,.55)}100%{box-shadow:0 0 0 9px rgba(45,212,167,0)}}
::selection{background:var(--accent);color:#0a0a0a}
.f{display:block;margin-top:14px;font-size:13.5px;color:var(--muted)}
.f input,.search,.num{display:block;width:100%;margin-top:6px;padding:12px 14px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:12px;background:#0e0e0e;color:var(--ink);transition:border-color .2s,box-shadow .25s}
.f input:focus,.search:focus,.num:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(157,226,79,.13)}
input[type=checkbox]{accent-color:var(--accent)}
.btn{border:0;border-radius:12px;cursor:pointer;background:var(--accent);color:#0a0a0a;font:700 15px/1 "Sora",system-ui,sans-serif;letter-spacing:-.01em;transition:transform .25s var(--ease),box-shadow .3s,background .25s,opacity .2s}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 30px -10px rgba(157,226,79,.6)}
.btn:active:not(:disabled){transform:scale(.97);box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;padding:4px 2px;color:var(--accent);font:inherit;font-size:14px;cursor:pointer;text-decoration:none;border-bottom:1px solid transparent;transition:border-color .2s}
.link:hover{border-bottom-color:var(--accent)}
.msg{font-size:14px;min-height:1.3em;margin:12px 0 0;color:var(--bad)}.msg.ok{color:var(--accent)}
.toggle{position:relative;width:48px;height:28px;flex:none;display:inline-block}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle span{position:absolute;inset:0;background:#2a2a2a;border-radius:999px;transition:background .3s;cursor:pointer}
.toggle span::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;background:#ececec;border-radius:50%;transition:transform .4s var(--spring),background .3s}
.toggle input:checked+span{background:var(--accent)}
.toggle input:checked+span::after{transform:translateX(20px);background:#0a0a0a}
details>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .35s var(--ease),border-color .2s;flex:none;margin-top:-3px}
details[open]>summary::after{transform:rotate(225deg);border-color:var(--accent)}
details[open]>*:not(summary){animation:rise .4s var(--ease)}
input:focus-visible,button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.wrap{max-width:920px;margin:0 auto;padding:30px 20px 70px;animation:rise .7s var(--ease) both}
h1{font-weight:700;font-size:25px;line-height:1.1;margin:0;letter-spacing:-.025em;display:flex;align-items:center;gap:11px}
h1::before{content:"";width:13px;height:13px;border-radius:5px 50% 50% 50%;background:var(--accent);box-shadow:0 0 20px rgba(157,226,79,.65);transform:rotate(-20deg);flex:none}
h1 span{color:var(--accent)}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:22px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px;transition:border-color .3s,transform .4s var(--ease)}
details.card:hover,details.card[open]{border-color:#3a3a3a}
form.card{box-shadow:0 40px 90px -50px #000}
.btn{padding:11px 16px;font-size:14px}
.btn.ink{background:var(--ink)}.btn.ok{background:var(--ok)}
.btn.line{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.line:hover:not(:disabled){border-color:var(--accent);color:var(--accent);box-shadow:none}
.btn.full{width:100%;padding:15px;font-size:16px;margin-top:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:16px 18px;transition:border-color .3s,transform .4s var(--ease)}
.stat:hover{border-color:#3a3a3a;transform:translateY(-3px)}
.stat small{color:var(--muted);font-size:12.5px}
.stat b{display:block;font-weight:700;font-size:28px;line-height:1.25;letter-spacing:-.03em;margin-top:2px}
.stat:nth-child(2) b{color:var(--accent)}
.shop{display:flex;flex-direction:column;gap:10px}
.shop:hover{border-color:#3a3a3a;transform:translateY(-2px)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-weight:700;font-size:18px;letter-spacing:-.02em}
.badge{font-size:12.5px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;background:#0e0e0e}
.badge.paid{color:var(--accent);border-color:rgba(157,226,79,.4);background:rgba(157,226,79,.08)}
.badge.trial{color:var(--warn);border-color:rgba(245,185,66,.4);background:rgba(245,185,66,.08)}
.badge.bad{color:var(--bad);border-color:rgba(255,107,94,.4);background:rgba(255,107,94,.08)}
.meta{font-size:13px;color:var(--muted);word-break:break-all}
.meta strong{color:var(--ink);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.search{margin:0 0 16px;padding:12px 18px;border-radius:999px}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<main class="wrap hidden" id="authView" style="max-width:400px;padding-top:40px">
  <h1>Xerox <span>Flow</span></h1><p class="sub">Admin login</p>
  <form class="card" id="loginForm" style="margin-top:20px" novalidate>
    <label class="f">Email<input type="email" id="email" autocomplete="username" required></label>
    <label class="f">Password<input type="password" id="pass" autocomplete="current-password" required></label>
    <p class="msg" id="lmsg" role="alert"></p>
    <button class="btn full" type="submit">Login</button>
  </form>
</main>

<div class="wrap hidden" id="appView">
  <header>
    <div><h1>Xerox <span>Flow</span></h1><p class="sub">Admin panel</p></div>
    <button class="btn line" id="logout">Logout</button>
  </header>

  <div class="stats">
    <div class="stat"><small>Total dukaan</small><b id="sTotal">0</b></div>
    <div class="stat"><small>Paid</small><b id="sPaid">0</b></div>
    <div class="stat"><small>Trial</small><b id="sTrial">0</b></div>
    <div class="stat"><small>Expired / Pause</small><b id="sBad">0</b></div>
  </div>

  <details class="card">
    <summary>Payment settings (owners ko ye dikhega)</summary>
    <form id="setForm" novalidate>
      <label class="f">Aapka UPI ID<input type="text" id="setUpi" placeholder="naam@upi" autocapitalize="none"></label>
      <label class="f">WhatsApp number (91 ke saath, jaise 919876543210)<input type="tel" id="setWa" inputmode="numeric"></label>
      <button class="btn ink full" type="submit">Save karo</button>
      <p class="msg" id="smsg"></p>
    </form>
  </details>

  <details class="card">
    <summary>Plans (order limit aur price)</summary>
    <form id="planForm" novalidate>
      <div id="planRows"></div>
      <button class="btn ink full" type="submit">Plans save karo</button>
      <p class="msg" id="pmsg"></p>
    </form>
  </details>

  <input class="search" id="search" type="search" placeholder="Dukaan ya email dhundo" aria-label="Search">
  <div id="list"></div>
  <p class="msg" id="gmsg" role="alert"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://iwzacblitkdzenmrugjj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_e5XcNyI8JFpzgMwBmE5XIg__BGgyjKM';
const $ = id => document.getElementById(id);
// alag storageKey: admin aur owner ka login ek doosre ko logout na kare
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: 'xf-admin-auth' } });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DAY = 86400000;
let shops = [], plans = {}, cfg = { monthly_price: '499', upi_id: '', whatsapp: '' };

function show(v) { $('authView').classList.toggle('hidden', v !== 'auth'); $('appView').classList.toggle('hidden', v !== 'app'); }
const left = iso => iso ? Math.ceil((new Date(iso) - Date.now()) / DAY) : 0;
const fmt = iso => new Date(iso).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });

function info(s) {
  if (s.status === 'paused') return { t: 'Paused', c: 'bad', k: 'bad' };
  const p = left(s.paid_until), t = left(s.trial_ends_at);
  if (p > 0) return { t: `Paid · ${p} din (${fmt(s.paid_until)} tak)`, c: 'paid', k: 'paid' };
  if (t > 0) return { t: `Trial · ${t} din`, c: 'trial', k: 'trial' };
  return { t: 'Expired', c: 'bad', k: 'bad' };
}

function render() {
  const q = $('search').value.trim().toLowerCase();
  const items = shops.filter(s => !q || (s.name + ' ' + s.email + ' ' + s.slug).toLowerCase().includes(q));
  const kinds = shops.map(s => info(s).k);
  $('sTotal').textContent = shops.length;
  $('sPaid').textContent = kinds.filter(k => k === 'paid').length;
  $('sTrial').textContent = kinds.filter(k => k === 'trial').length;
  $('sBad').textContent = kinds.filter(k => k === 'bad').length;
  $('list').innerHTML = items.length ? items.map(s => {
    const i = info(s);
    return `<div class="card shop">
      <div class="top"><span class="name">${esc(s.name)}</span><span class="badge ${i.c}">${esc(i.t)}</span></div>
      <div class="meta">${esc(s.email)} · code: ${esc(s.slug)}</div>
      <div class="meta">Orders: aaj ${s.orders_today} · total ${s.orders_total} · joined ${fmt(s.created_at)}</div>
      <div class="meta">Plan: <strong>${esc((plans[s.plan] || {}).name || s.plan)}</strong> · is mahine ${s.orders_month} / ${(plans[s.plan] || {}).monthly_limit ?? '?'} orders</div>
      <div class="acts">
        <button class="btn ok" data-act="add1" data-id="${s.id}">+1 mahina</button>
        <button class="btn ok" data-act="add3" data-id="${s.id}">+3 mahine</button>
        <button class="btn line" data-act="plan" data-id="${s.id}">Plan badlo</button>
        <button class="btn line" data-act="trial7" data-id="${s.id}">Trial +7 din</button>
        ${s.status === 'paused'
          ? `<button class="btn ink" data-act="resume" data-id="${s.id}">Chalu karo</button>`
          : `<button class="btn line" data-act="pause" data-id="${s.id}">Pause</button>`}
      </div></div>`;
  }).join('') : '<div class="card sub">Koi dukaan nahi mili.</div>';
}

async function load() {
  $('gmsg').textContent = '';
  const [a, b, c] = await Promise.all([sb.rpc('admin_list_shops'), sb.from('app_settings').select('*'), sb.from('plans').select('*').order('monthly_limit')]);
  if (a.error) {
    const m = a.error.message || '';
    if (/not allowed/i.test(m)) { show('auth'); $('lmsg').textContent = 'Ye account admin nahi hai.'; await sb.auth.signOut(); }
    else {
      $('gmsg').textContent = 'Error: ' + m;
      if ($('appView').classList.contains('hidden')) { show('auth'); $('lmsg').textContent = 'Error: ' + m; }
    }
    return;
  }
  shops = a.data || [];
  (b.data || []).forEach(r => cfg[r.key] = r.value);
  plans = {}; (c.data || []).forEach(p => plans[p.key] = p);
  renderPlanForm();
  $('setUpi').value = cfg.upi_id; $('setWa').value = cfg.whatsapp;
  render(); show('app');
}

async function call(fn, args) {
  const { data: sess } = await sb.auth.getSession();
  if (!sess.session) { alert('Login session khatam ho gaya. Dobara login karein.'); show('auth'); return; }
  const { error } = await sb.rpc(fn, args);
  if (error) {
    const m = error.message || String(error);
    $('gmsg').textContent = 'Error: ' + m;
    alert('Error: ' + m + (/permission denied/i.test(m) ? '\n\nLogout karke dobara login karein.' : ''));
    return;
  }
  await load();
}

$('list').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const s = shops.find(x => x.id === b.dataset.id); if (!s) return;
  const price = Number((plans[s.plan] || {}).price) || 0;
  if (b.dataset.act === 'add1' || b.dataset.act === 'add3') {
    const m = b.dataset.act === 'add1' ? 1 : 3, amt = price * m;
    if (confirm(`${s.name}: ₹${amt} mil gaye? ${m} mahina chalu karein?`))
      call('admin_activate', { p_shop_id: s.id, p_months: m, p_amount: amt, p_note: 'manual UPI' });
  } else if (b.dataset.act === 'plan') {
    const keys = Object.keys(plans), next = keys[(keys.indexOf(s.plan) + 1) % keys.length];
    if (confirm(`${s.name}: plan ${plans[s.plan].name} se ${plans[next].name} karein?`))
      call('admin_set_shop_plan', { p_shop_id: s.id, p_plan: next });
  } else if (b.dataset.act === 'trial7') {
    call('admin_extend_trial', { p_shop_id: s.id, p_days: 7 });
  } else if (b.dataset.act === 'pause') {
    if (confirm(`${s.name} ko pause karein? Customers order nahi de payenge.`)) call('admin_set_status', { p_shop_id: s.id, p_status: 'paused' });
  } else if (b.dataset.act === 'resume') {
    call('admin_set_status', { p_shop_id: s.id, p_status: left(s.paid_until) > 0 ? 'active' : 'trial' });
  }
});

$('setForm').addEventListener('submit', async e => {
  e.preventDefault();
  const vals = { upi_id: $('setUpi').value.trim(), whatsapp: $('setWa').value.replace(/\D/g, '') };
  for (const [k, v] of Object.entries(vals)) {
    const { error } = await sb.rpc('admin_set_setting', { p_key: k, p_value: v });
    if (error) { $('smsg').classList.remove('ok'); $('smsg').textContent = 'Error: ' + error.message; alert('Error: ' + error.message); return; }
  }
  Object.assign(cfg, vals);
  $('smsg').classList.add('ok'); $('smsg').textContent = 'Save ho gaya.';
});

function renderPlanForm() {
  $('planRows').innerHTML = Object.values(plans).map(p => `
    <label class="f"><strong>${esc(p.name)}</strong> · order limit / mahina<input type="number" min="1" data-pl="${esc(p.key)}" data-f="limit" value="${p.monthly_limit}"></label>
    <label class="f">${esc(p.name)} · price (₹ / mahina)<input type="number" min="0" data-pl="${esc(p.key)}" data-f="price" value="${p.price}"></label>`).join('');
}
$('planForm').addEventListener('submit', async e => {
  e.preventDefault();
  for (const p of Object.values(plans)) {
    const lim = Number(document.querySelector(`[data-pl="${p.key}"][data-f="limit"]`).value);
    const pr = Number(document.querySelector(`[data-pl="${p.key}"][data-f="price"]`).value);
    const { error } = await sb.rpc('admin_set_plan', { p_key: p.key, p_limit: lim, p_price: pr });
    if (error) { $('pmsg').classList.remove('ok'); $('pmsg').textContent = 'Error: ' + error.message; alert('Error: ' + error.message); return; }
  }
  await load();
  $('pmsg').classList.add('ok'); $('pmsg').textContent = 'Plans save ho gaye.';
});
$('search').addEventListener('input', render);
$('logout').addEventListener('click', async () => { await sb.auth.signOut(); show('auth'); });
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault(); $('lmsg').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim().toLowerCase(), password: $('pass').value });
  if (error) return $('lmsg').textContent = /invalid/i.test(error.message) ? 'Email ya password galat hai.' : error.message;
  load();
});

(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) load(); else show('auth');
})();
</script>
</body>
</html>
