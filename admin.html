<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>admin.html</title>
<meta name="theme-color" content="#F1F5F9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#F1F5F9;--card:#FFFFFF;--surface:#F8FAFC;--ink:#0F172A;--ink2:#334155;--muted:#64748B;--line:#E2E8F0;
  --accent:#2563EB;--accent-hover:#1D4ED8;--accent-soft:#EFF6FF;--accent-line:#BFDBFE;
  --ok:#059669;--ok-soft:#ECFDF5;--ok-line:#A7F3D0;
  --warn:#D97706;--warn-soft:#FFFBEB;--warn-line:#FDE68A;
  --bad:#DC2626;--bad-soft:#FEF2F2;--bad-line:#FECACA;
  --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}
*{box-sizing:border-box}html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);
  font:15px/1.55 "DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
}
h1,h2,.stat b,.name{font-family:"Sora","DM Sans",system-ui,sans-serif}
a{color:var(--accent)}
.hidden{display:none!important}
.sub{color:var(--muted);margin:4px 0 0;font-size:13.5px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.wrap{max-width:1040px;margin:0 auto;padding:24px 18px 70px;animation:rise .45s var(--ease) both}

/* Header */
header{
  display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 20px;margin-bottom:18px;
  box-shadow:0 1px 3px rgba(15,23,42,.04);
}
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{
  width:38px;height:38px;border-radius:11px;background:var(--accent);color:#fff;
  display:grid;place-items:center;flex:none;
}
.brand-mark svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{font-weight:700;font-size:21px;line-height:1.1;margin:0;letter-spacing:-.025em}
h1 span{color:var(--accent)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;
  box-shadow:0 1px 2px rgba(15,23,42,.03);
}
.stat small{color:var(--muted);font-size:12.5px;font-weight:600}
.stat b{display:block;font-weight:800;font-size:28px;line-height:1.2;letter-spacing:-.03em;margin-top:4px;color:var(--ink)}
.stat:nth-child(2) b{color:var(--ok)}
.stat:nth-child(3) b{color:var(--accent)}
.stat:nth-child(4) b{color:var(--bad)}

/* Cards & Forms */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:12px;
  box-shadow:0 1px 3px rgba(15,23,42,.04);transition:border-color .2s;
}
.card:hover{border-color:#CBD5E1}
details>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--ink)}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .25s;flex:none}
details[open]>summary::after{transform:rotate(225deg);border-color:var(--accent)}

.f{display:block;margin-top:14px;font-size:13px;font-weight:600;color:var(--ink2)}
.f input,.search{
  display:block;width:100%;margin-top:6px;padding:11px 14px;font:inherit;font-size:15px;
  border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);
  transition:border-color .2s,box-shadow .2s;
}
.f input:focus,.search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.14)}
.search{margin:0 0 16px;padding:12px 16px;border-radius:12px;background:var(--card)}

/* Buttons */
.btn{
  border:0;border-radius:10px;cursor:pointer;padding:9px 14px;
  background:var(--accent);color:#fff;font:600 13.5px/1.1 "DM Sans",system-ui,sans-serif;
  transition:background .15s,transform .15s,opacity .15s;
}
.btn:hover:not(:disabled){background:var(--accent-hover)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ok{background:var(--accent);color:#fff}
.btn.ink{background:var(--ink);color:#fff}
.btn.line{background:#fff;color:var(--ink2);border:1px solid #CBD5E1}
.btn.line:hover:not(:disabled){border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn.danger{background:#fff;color:var(--bad);border:1px solid var(--bad-line)}
.btn.danger:hover:not(:disabled){background:var(--bad-soft);border-color:var(--bad)}
.btn.full{width:100%;padding:13px;font-size:15px;margin-top:16px}
.msg{font-size:13.5px;min-height:1.2em;margin:10px 0 0;color:var(--bad);font-weight:500}.msg.ok{color:var(--ok)}

/* Shop Row */
.shop{display:flex;flex-direction:column;gap:12px}
.shop-row{display:grid;grid-template-columns:1.3fr 1fr auto;gap:18px;align-items:center}
.name{font-weight:700;font-size:17px;letter-spacing:-.02em;color:var(--ink)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.badge{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink2)}
.badge.paid{color:var(--ok);border-color:var(--ok-line);background:var(--ok-soft)}
.badge.trial{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}
.badge.bad{color:var(--bad);border-color:var(--bad-line);background:var(--bad-soft)}
.meta{font-size:13px;color:var(--muted);margin-top:4px;word-break:break-all}
.meta strong{color:var(--ink);font-weight:600}
.usage-bar{width:100%;height:7px;background:#E2E8F0;border-radius:999px;overflow:hidden;margin-top:7px}
.usage-fill{height:100%;background:var(--accent);border-radius:999px}
.acts{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end}

/* Modal Sheet */
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(15,23,42,.45);backdrop-filter:blur(6px);animation:fade .25s both}
.sheet-in{width:100%;max-width:440px;max-height:92vh;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:24px 20px;animation:up .35s var(--ease) both;box-shadow:0 -12px 40px rgba(15,23,42,.15)}
.sheet-in h2{margin:0;font:700 19px "Sora",sans-serif}
.pick{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;margin-top:10px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:all .2s}
.pick:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.pick b{display:block;font:700 15px "Sora",sans-serif}
.pick small{color:var(--muted);font-size:13px}
.pick:disabled{border-color:var(--accent-line);background:var(--accent-soft);cursor:default}
.pick .tag{font-size:11.5px;padding:3px 9px;border-radius:99px;background:var(--accent);color:#fff;font-weight:600}
.toast{position:fixed;left:0;right:0;margin:0 auto;width:max-content;max-width:90vw;bottom:24px;z-index:60;padding:11px 20px;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(15,23,42,.25);animation:fade .2s both}

@media(min-width:700px){.sheet{align-items:center}.sheet-in{border-radius:22px}}
@media(max-width:820px){.shop-row{grid-template-columns:1fr}.acts{justify-content:flex-start}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<main class="wrap hidden" id="authView" style="max-width:400px;padding-top:10vh">
  <div class="brand" style="justify-content:center;margin-bottom:18px">
    <div class="brand-mark"><svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg></div>
    <div><h1>Xerox<span>Flow</span></h1><p class="sub" style="margin:0">Super Admin Login</p></div>
  </div>
  <form class="card" id="loginForm" novalidate>
    <label class="f" style="margin-top:0">Email<input type="email" id="email" autocomplete="username" required></label>
    <label class="f">Password<input type="password" id="pass" autocomplete="current-password" required></label>
    <p class="msg" id="lmsg" role="alert"></p>
    <button class="btn full" type="submit">Login</button>
  </form>
</main>

<div class="wrap hidden" id="appView">
  <header>
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg></div>
      <div><h1>Xerox<span>Flow</span> Admin</h1><p class="sub" style="margin:0">Super Admin Control Panel</p></div>
    </div>
    <button class="btn line" id="logout">Logout</button>
  </header>

  <div class="stats">
    <div class="stat"><small>Total Dukaan</small><b id="sTotal">0</b></div>
    <div class="stat"><small>Paid</small><b id="sPaid">0</b></div>
    <div class="stat"><small>Active Trial</small><b id="sTrial">0</b></div>
    <div class="stat"><small>Expired / Pause</small><b id="sBad">0</b></div>
  </div>

  <details class="card">
    <summary>Payment settings (owners ko ye dikhega)</summary>
    <form id="setForm" novalidate>
      <label class="f">Aapka UPI ID<input type="text" id="setUpi" placeholder="naam@upi" autocapitalize="none"></label>
      <label class="f">WhatsApp number (91 ke saath, jaise 919876543210)<input type="tel" id="setWa" inputmode="numeric"></label>
      <button class="btn full" type="submit">Save karo</button>
      <p class="msg" id="smsg"></p>
    </form>
  </details>

  <details class="card">
    <summary>Plans (order limit aur price)</summary>
    <form id="planForm" novalidate>
      <div id="planRows"></div>
      <button class="btn full" type="submit">Plans save karo</button>
      <p class="msg" id="pmsg"></p>
    </form>
  </details>

  <input class="search" id="search" type="search" placeholder="Dukaan, email ya slug dhundo..." aria-label="Search">
  <div id="list"></div>
  <p class="msg" id="gmsg" role="alert"></p>
</div>

<div class="sheet hidden" id="pickView" role="dialog" aria-modal="true" aria-labelledby="pickT">
  <div class="sheet-in">
    <h2 id="pickT"></h2><p class="sub" id="pickS"></p>
    <div id="pickList"></div>
    <button class="btn line full" id="pickX" type="button">Band karo</button>
  </div>
</div>
<div class="toast hidden" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://iwzacblitkdzenmrugjj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_e5XcNyI8JFpzgMwBmE5XIg__BGgyjKM';
const $ = id => document.getElementById(id);
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: 'xf-admin-auth' } });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DAY = 86400000;
let shops = [], plans = {}, cfg = { monthly_price: '499', upi_id: '', whatsapp: '' };

function show(v) { $('authView').classList.toggle('hidden', v !== 'auth'); $('appView').classList.toggle('hidden', v !== 'app'); }
const left = iso => iso ? Math.ceil((new Date(iso) - Date.now()) / DAY) : 0;
const fmt = iso => new Date(iso).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });

function info(s) {
  if (s.status === 'paused') return { t: 'Paused', c: 'bad', k: 'bad' };
  const p = left(s.paid_until), t = left(s.trial_ends_at);
  if (p > 0) return { t: `Paid · ${p} din (${fmt(s.paid_until)})`, c: 'paid', k: 'paid' };
  if (t > 0) return { t: `Trial · ${t} din`, c: 'trial', k: 'trial' };
  return { t: 'Expired', c: 'bad', k: 'bad' };
}

function render() {
  const q = $('search').value.trim().toLowerCase();
  const items = shops.filter(s => !q || (s.name + ' ' + s.email + ' ' + s.slug).toLowerCase().includes(q));
  const kinds = shops.map(s => info(s).k);
  $('sTotal').textContent = shops.length;
  $('sPaid').textContent = kinds.filter(k => k === 'paid').length;
  $('sTrial').textContent = kinds.filter(k => k === 'trial').length;
  $('sBad').textContent = kinds.filter(k => k === 'bad').length;
  $('list').innerHTML = items.length ? items.map(s => {
    const i = info(s);
    const lim = (plans[s.plan] || {}).monthly_limit || 300;
    const pct = Math.min(100, Math.round((Number(s.orders_month) || 0) / lim * 100));
    return `<div class="card shop">
      <div class="shop-row">
        <div>
          <div class="name">${esc(s.name)}</div>
          <div class="pills">
            <span class="badge ${i.c}">${esc(i.t)}</span>
            <span class="badge">${esc((plans[s.plan] || {}).name || s.plan)}</span>
          </div>
          <div class="meta">${esc(s.email)} · /s/${esc(s.slug)}</div>
        </div>
        <div>
          <div class="meta" style="margin:0">Monthly usage: <strong>${s.orders_month} / ${lim}</strong> · Aaj: <strong>${s.orders_today}</strong></div>
          <div class="usage-bar"><div class="usage-fill" style="width:${pct}%;background:${pct >= 90 ? 'var(--bad)' : 'var(--accent)'}"></div></div>
          <div class="meta">Total orders: ${s.orders_total} · Joined ${fmt(s.created_at)}</div>
        </div>
        <div class="acts">
          <button class="btn ok" data-act="add1" data-id="${s.id}">+1 Mahina</button>
          <button class="btn line" data-act="add3" data-id="${s.id}">+3 Mahine</button>
          <button class="btn line" data-act="plan" data-id="${s.id}">Plan</button>
          ${left(s.paid_until) > 0 ? '' : `<button class="btn line" data-act="trial7" data-id="${s.id}">+7d Trial</button>`}
          ${s.status === 'paused'
            ? `<button class="btn ink" data-act="resume" data-id="${s.id}">Chalu karo</button>`
            : `<button class="btn line" data-act="pause" data-id="${s.id}">Pause</button>`}
          ${(left(s.paid_until) > 0 || left(s.trial_ends_at) > 0) ? `<button class="btn danger" data-act="cancel" data-id="${s.id}">Cancel</button>` : ''}
        </div>
      </div>
    </div>`;
  }).join('') : '<div class="card sub" style="text-align:center;padding:32px">Koi dukaan nahi mili.</div>';
}

async function load() {
  $('gmsg').textContent = '';
  const [a, b, c] = await Promise.all([sb.rpc('admin_list_shops'), sb.from('app_settings').select('*'), sb.from('plans').select('*').order('monthly_limit')]);
  if (a.error) {
    const m = a.error.message || '';
    if (/not allowed/i.test(m)) { show('auth'); $('lmsg').textContent = 'Ye account admin nahi hai.'; await sb.auth.signOut(); }
    else {
      $('gmsg').textContent = 'Error: ' + m;
      if ($('appView').classList.contains('hidden')) { show('auth'); $('lmsg').textContent = 'Error: ' + m; }
    }
    return;
  }
  shops = a.data || [];
  (b.data || []).forEach(r => cfg[r.key] = r.value);
  plans = {}; (c.data || []).forEach(p => plans[p.key] = p);
  renderPlanForm();
  $('setUpi').value = cfg.upi_id; $('setWa').value = cfg.whatsapp;
  render(); show('app');
}

async function call(fn, args) {
  const { data: sess } = await sb.auth.getSession();
  if (!sess.session) { alert('Login session khatam ho gaya. Dobara login karein.'); show('auth'); return; }
  const { error } = await sb.rpc(fn, args);
  if (error) {
    const m = error.message || String(error);
    $('gmsg').textContent = 'Error: ' + m;
    alert('Error: ' + m);
    return false;
  }
  await load();
  return true;
}

let toastT = null;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), 3200);
}
function openPicker(s) {
  $('pickT').textContent = s.name;
  $('pickS').textContent = 'Kaun sa plan dena hai? Tap karein.';
  $('pickList').innerHTML = Object.values(plans).map(p => `
    <button class="pick" type="button" data-key="${esc(p.key)}"${p.key === s.plan ? ' disabled' : ''}>
      <span><b>${esc(p.name)}</b><small>${p.monthly_limit} orders / mahina · ₹${esc(p.price)}</small></span>
      ${p.key === s.plan ? '<span class="tag">Current</span>' : ''}
    </button>`).join('');
  $('pickView').dataset.id = s.id;
  $('pickView').classList.remove('hidden');
}
function closePicker() { $('pickView').classList.add('hidden'); }
$('pickX').addEventListener('click', closePicker);
$('pickView').addEventListener('click', async e => {
  if (e.target === e.currentTarget) return closePicker();
  const b = e.target.closest('.pick'); if (!b || b.disabled) return;
  const s = shops.find(x => x.id === $('pickView').dataset.id); if (!s) return;
  closePicker();
  if (await call('admin_set_shop_plan', { p_shop_id: s.id, p_plan: b.dataset.key })) toast(`${s.name}: ${plans[b.dataset.key].name} plan laga diya`);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePicker(); });

async function giveTrial(s) {
  if (s.status === 'paused' && !(await call('admin_set_status', { p_shop_id: s.id, p_status: 'trial' }))) return;
  const target = Date.now() + 7 * DAY - 3600000;
  if (!(await call('admin_extend_trial', { p_shop_id: s.id, p_days: 7 }))) return;
  const now = shops.find(x => x.id === s.id);
  if (now) {
    const short = Math.ceil((target - new Date(now.trial_ends_at)) / DAY);
    if (short > 0 && !(await call('admin_extend_trial', { p_shop_id: s.id, p_days: short }))) return;
  }
  toast(`${s.name}: 7 din ka trial chalu`);
}

async function cancelPlan(s) {
  if (!confirm(`${s.name} ka plan abhi cancel karein?\nDukaan turant Expired ho jayegi.`)) return;
  if (await call('admin_cancel_plan', { p_shop_id: s.id })) toast(`${s.name}: plan cancel ho gaya`);
}

$('list').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const s = shops.find(x => x.id === b.dataset.id); if (!s) return;
  const price = Number((plans[s.plan] || {}).price) || 0;
  if (b.dataset.act === 'add1' || b.dataset.act === 'add3') {
    const m = b.dataset.act === 'add1' ? 1 : 3, amt = price * m;
    if (confirm(`${s.name}: ₹${amt} mil gaye? ${m} mahina chalu karein?`))
      call('admin_activate', { p_shop_id: s.id, p_months: m, p_amount: amt, p_note: 'manual UPI' });
  } else if (b.dataset.act === 'plan') {
    openPicker(s);
  } else if (b.dataset.act === 'trial7') {
    giveTrial(s);
  } else if (b.dataset.act === 'cancel') {
    cancelPlan(s);
  } else if (b.dataset.act === 'pause') {
    if (confirm(`${s.name} ko pause karein? Customers order nahi de payenge.`)) call('admin_set_status', { p_shop_id: s.id, p_status: 'paused' });
  } else if (b.dataset.act === 'resume') {
    call('admin_set_status', { p_shop_id: s.id, p_status: left(s.paid_until) > 0 ? 'active' : 'trial' });
  }
});

$('setForm').addEventListener('submit', async e => {
  e.preventDefault();
  const vals = { upi_id: $('setUpi').value.trim(), whatsapp: $('setWa').value.replace(/\D/g, '') };
  for (const [k, v] of Object.entries(vals)) {
    const { error } = await sb.rpc('admin_set_setting', { p_key: k, p_value: v });
    if (error) { $('smsg').classList.remove('ok'); $('smsg').textContent = 'Error: ' + error.message; alert('Error: ' + error.message); return; }
  }
  Object.assign(cfg, vals);
  $('smsg').classList.add('ok'); $('smsg').textContent = 'Save ho gaya.';
});

function renderPlanForm() {
  $('planRows').innerHTML = Object.values(plans).map(p => `
    <label class="f"><strong>${esc(p.name)}</strong> · order limit / mahina<input type="number" min="1" data-pl="${esc(p.key)}" data-f="limit" value="${p.monthly_limit}"></label>
    <label class="f">${esc(p.name)} · price (₹ / mahina)<input type="number" min="0" data-pl="${esc(p.key)}" data-f="price" value="${p.price}"></label>`).join('');
}
$('planForm').addEventListener('submit', async e => {
  e.preventDefault();
  for (const p of Object.values(plans)) {
    const lim = Number(document.querySelector(`[data-pl="${p.key}"][data-f="limit"]`).value);
    const pr = Number(document.querySelector(`[data-pl="${p.key}"][data-f="price"]`).value);
    const { error } = await sb.rpc('admin_set_plan', { p_key: p.key, p_limit: lim, p_price: pr });
    if (error) { $('pmsg').classList.remove('ok'); $('pmsg').textContent = 'Error: ' + error.message; alert('Error: ' + error.message); return; }
  }
  await load();
  $('pmsg').classList.add('ok'); $('pmsg').textContent = 'Plans save ho gaye.';
});
$('search').addEventListener('input', render);
$('logout').addEventListener('click', async () => { await sb.auth.signOut(); show('auth'); });
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault(); $('lmsg').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim().toLowerCase(), password: $('pass').value });
  if (error) return $('lmsg').textContent = /invalid/i.test(error.message) ? 'Email ya password galat hai.' : error.message;
  load();
});

(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) load(); else show('auth');
})();
</script>
</body>
</html>
